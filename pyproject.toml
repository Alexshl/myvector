[project]
name = "myvec"
version = "0.1.0"
description = "Local hybrid (vector + full-text) code search and two-level memory for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "sqlite-vec>=0.1.9",
    "pathspec>=1.0",
    "tree-sitter-language-pack>=0.13,<1",
    "numpy>=1.26",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "watchdog>=7.1,<8",
    "psutil>=5.9",
]

[project.scripts]
myvec = "myvec.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myvec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
