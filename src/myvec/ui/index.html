<!doctype html>
<html lang="uk" data-density="regular">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{CSRF_TOKEN}}">
  <meta name="color-scheme" content="light dark">
  <title>MyVector</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <script>
    // Theme before first paint: saved choice, else the OS preference.
    (function () {
      var t = null;
      try { t = localStorage.getItem('myvec-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app"><noscript>Для інтерфейсу MyVector потрібен JavaScript.</noscript></div>
  <div id="toasts" class="toasts" role="region" aria-label="Сповіщення" aria-live="polite"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
